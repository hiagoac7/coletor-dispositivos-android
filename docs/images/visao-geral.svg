<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">Coletor de Dispositivos Android</title><desc id="desc">Diagrama funcional do projeto, não é captura de tela. Identificação de aparelhos e cliente de integração com Google Sheets</desc>
<rect width="1200" height="460" rx="20" fill="#0f172a"/>
<rect x="40" y="40" width="5" height="60" rx="2" fill="#4ade80"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="65" y="62" fill="#94a3b8" font-size="13" letter-spacing="2">PORTFÓLIO · HIAGO CAVALHEIRO</text>
<text x="65" y="103" fill="#f8fafc" font-size="34" font-weight="700">Coletor de Dispositivos Android</text>
<text x="65" y="138" fill="#cbd5e1" font-size="18">Identificação de aparelhos e cliente de integração com Google Sheets</text><rect x="40" y="180" width="340" height="174" rx="14" fill="#1e293b" stroke="#334155"/><text x="64" y="212" fill="#4ade80" font-size="13" font-weight="700">01 · IDENTIFICAR</text><text x="64" y="250" fill="#f8fafc" font-size="23" font-weight="600">Android + PyJNIus</text><text x="64" y="289" fill="#cbd5e1" font-size="17">Fabricante, modelo e versão</text><text x="64" y="317" fill="#cbd5e1" font-size="17">Android ID e serial disponível</text><path d="M 390 267 h 27 m -7 -7 l 7 7 -7 7" stroke="#4ade80" stroke-width="2" fill="none"/><rect x="430" y="180" width="340" height="174" rx="14" fill="#1e293b" stroke="#334155"/><text x="454" y="212" fill="#4ade80" font-size="13" font-weight="700">02 · ASSOCIAR</text><text x="454" y="250" fill="#f8fafc" font-size="23" font-weight="600">Interface Kivy</text><text x="454" y="289" fill="#cbd5e1" font-size="17">Seleção do usuário</text><text x="454" y="317" fill="#cbd5e1" font-size="17">Configuração local do cliente</text><path d="M 780 267 h 27 m -7 -7 l 7 7 -7 7" stroke="#4ade80" stroke-width="2" fill="none"/><rect x="820" y="180" width="340" height="174" rx="14" fill="#1e293b" stroke="#334155"/><text x="844" y="212" fill="#4ade80" font-size="13" font-weight="700">03 · ENVIAR</text><text x="844" y="250" fill="#f8fafc" font-size="23" font-weight="600">Apps Script → Sheets</text><text x="844" y="289" fill="#cbd5e1" font-size="17">Requisição HTTP POST</text><text x="844" y="317" fill="#cbd5e1" font-size="17">Endpoint configurado à parte</text><text x="40" y="399" fill="#4ade80" font-size="15" letter-spacing="1">PYTHON   /   KIVY   /   PYJNIUS   /   BUILDOZER</text><text x="40" y="432" fill="#94a3b8" font-size="13">DIAGRAMA FUNCIONAL · Baseado nos componentes presentes no código</text></g></svg>
